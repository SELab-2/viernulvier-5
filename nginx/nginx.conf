events {
    worker_connections 1024;
}

http {
    server_tokens off;
    charset utf-8;
    
    # always redirect to https
    server {
        listen 80 default_server;

        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        http2 on;

        # use certificates
        ssl_certificate         /etc/letsencrypt/live/sel2-5.ugent.be/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/sel2-5.ugent.be/privkey.pem;

        server_name sel2-5.ugent.be;
        root /var/www/html;
        index index.html index.htm;

        location / {
            proxy_pass http://frontend:8000;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
