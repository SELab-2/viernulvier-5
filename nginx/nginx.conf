# Nginx configuration for VIERNULVIER archive website
#
# Handles two subdomains:
#   - archief.viernulvier.be     → public frontend + API proxy
#   - admin.archief.viernulvier.be → admin frontend + API proxy
#
# For local development, use Vite's built-in proxy instead.
# This config is for the production Ubuntu server.

events {
    worker_connections 1024;
}

# Public site
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    upstream fastify_backend {
        server backend:3001;
    }
    
    # always redirect to https
    server {
        listen 80 default_server;

        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        http2 on;

        # use certificates
        ssl_certificate         /etc/letsencrypt/live/sel2-5.ugent.be/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/sel2-5.ugent.be/privkey.pem;

        server_name sel2-5.ugent.be archief.viernulvier.be admin.archief.viernulvier.be;

        # Frontend static files
        root /var/www/html;
        index index.html index.htm;

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri /index.html;
        }

        # API proxy
        location /api/ {
            proxy_pass http://fastify_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Swagger docs proxy (development/staging only)
        location /docs {
            proxy_pass http://fastify_backend;
            proxy_set_header Host $host;
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
