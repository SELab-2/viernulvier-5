# Nginx configuration for VIERNULVIER archive website
#
# Handles two subdomains:
#   - archief.viernulvier.be     → public frontend + API proxy
#   - admin.archief.viernulvier.be → admin frontend + API proxy
#
# For local development, use Vite's built-in proxy instead.
# This config is for the production Ubuntu server.

upstream fastify_backend {
    server 127.0.0.1:3001;
}

# Public site
server {
    listen 80;
    server_name archief.viernulvier.be;

    # Frontend static files
    root /var/www/viernulvier/frontend/dist;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://fastify_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger docs proxy (development/staging only)
    location /docs {
        proxy_pass http://fastify_backend;
        proxy_set_header Host $host;
    }
}

# Admin site
server {
    listen 80;
    server_name admin.archief.viernulvier.be;

    # Same frontend build, different subdomain
    root /var/www/viernulvier/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://fastify_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
