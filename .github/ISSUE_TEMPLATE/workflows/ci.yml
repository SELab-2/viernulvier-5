name: CI

# Runs on every push to any branch (gives immediate feedback after committing)
# and on every pull request event (acts as the merge gate).
# Concurrency ensures that if you push again before the previous run finishes,
# the old run is cancelled to save resources.
on:
  push:
    branches-ignore:
      - main # main is protected; direct pushes are blocked via branch protection rules
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint # Only run tests if linting passed; saves time on obvious failures
    
    services:
      # Spin up a PostgreSQL instance for backend integration tests.
      # Remove this block entirely if your tests use a mock/in-memory DB instead.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Wait until Postgres is actually ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --ci --passWithNoTests
        env:
          # Provide DB connection details to the test environment.
          # Add any other secrets your tests need as GitHub Actions secrets
          # and reference them here: ${{ secrets.YOUR_SECRET }}
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          NODE_ENV: test