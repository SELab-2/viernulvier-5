name: Close linked issues on develop merge

on:
  pull_request:
    types: [closed]

jobs:
  close-issues:
    if: >
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // Match phrases
            const keywordRegex =
              /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s*((#\d+[\s,]*)+)/gi;

            const issueNumbers = new Set();

            for (const match of body.matchAll(keywordRegex)) {
              const issuePart = match[3];

              // Extract all issue numbers
              const numbers = issuePart.match(/\d+/g) || [];

              for (const num of numbers) {
                issueNumbers.add(Number(num));
              }
            }

            if (issueNumbers.size === 0) {
              console.log("No linked issues found.");
              return;
            }

            for (const issueNumber of issueNumbers) {
              console.log(`Closing issue #${issueNumber}`);

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: "closed",
                state_reason: "completed"
              });
            }