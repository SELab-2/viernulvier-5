name: CI

# Runs on every push to any branch (except main) and on pull request updates.
# Concurrency ensures stale runs are cancelled when new commits are pushed.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint + Test)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viernulvier_test
      JWT_SECRET: test-secret-for-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      # Fail CI on any lint warning. Placeholder exceptions are handled inline.
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Fail CI on any lint warning. Placeholder exceptions are handled inline.
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
