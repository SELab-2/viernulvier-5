name: CI

# Runs on every push to any branch (except main) and on pull request updates.
# Concurrency ensures stale runs are cancelled when new commits are pushed.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint + Test)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/viernulvier
      JWT_SECRET: test-secret-for-ci
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: password123
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Start database
        working-directory: ${{ github.workspace }}
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d db

          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U postgres -d viernulvier; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs db
          exit 1

      - run: npx prisma migrate deploy
      # Fail CI on any lint warning. Placeholder exceptions are handled inline.
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm test

      - name: Stop database
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose down -v --remove-orphans

  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Fail CI on any lint warning. Placeholder exceptions are handled inline.
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
