name: CI

# Runs on every push to any branch (except main) and on pull request updates.
# Concurrency ensures stale runs are cancelled when new commits are pushed.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint + Test)
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viernulvier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viernulvier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/viernulvier_test
      JWT_SECRET: test-secret-for-ci
      NODE_ENV: test
      SKIP_TEST_DB_START: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      # Fail CI on any lint warning. Placeholder exceptions are handled inline.
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Fail CI on any lint warning. Placeholder exceptions are handled inline.
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
