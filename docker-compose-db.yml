services:
  database:
    container_name: vnv_container
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vnv_data:/var/lib/postgresql/data
    networks:
      - vnv_net
    restart: unless-stopped

volumes:
  vnv_data:

networks:
  vnv_net:
