services:
  backend:
    build: ./backend
    container_name: vnv_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - 3001:3001
    networks:
        - vnv_net

  frontend:
    build: ./frontend
    container_name: vnv_frontend
    volumes:
      - dist:/usr/src/app/dist
    networks:
      - vnv_net

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - dist:/var/www/html
    networks:
      - vnv_net

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    env_file:
      - ./.env
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - vnv_net
    command: certonly --webroot -w /var/www/certbot -n --email ${CERTBOT_MAIL} -d ${DOMAIN} --agree-tos

networks:
  vnv_net:
    external: true

volumes:
  dist: {}
